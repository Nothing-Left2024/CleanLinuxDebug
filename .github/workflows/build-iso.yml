name: Build CleanLinux ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Docker
      uses: docker/setup-docker@v4

    - name: Build ISO in privileged Arch container
      run: |
        docker run --privileged --rm \
          -v "$(pwd)/iso-build/archiso:/src:ro" \
          -v "$(pwd)/iso-out:/out" \
          archlinux:latest bash -e -c '
            set -e
            echo "==> 安装 archiso 及构建依赖..."
            pacman -Sy --noconfirm --needed base-devel xorriso mtools squashfs-tools archiso
            echo "==> 运行 mkarchiso..."
            mkarchiso -v -w /root/work -o /out /src
          '
        ls -lh iso-out/
        file iso-out/*.iso

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: CleanLinux-RTX2060
        path: iso-out/*.iso
        retention-days: 30
        if-no-files-found: error

name: Build CleanLinux ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60

    steps:
    # 容器内无 Node.js，先装 nodejs 供 actions 与后续步骤使用
    - name: Install Node.js
      run: |
        pacman -Sy --noconfirm --needed nodejs tar

    - name: Clone repository
      run: |
        git clone https://github.com/Nothing-Left2024/CleanLinuxDebug.git /workspace
        cd /workspace
        git config --global --add safe.directory /workspace
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        echo "WORKDIR=/workspace" >> $GITHUB_ENV

    - name: Install build dependencies
      run: |
        pacman -S --noconfirm --needed \
          base-devel git xorriso mtools squashfs-tools archiso

    - name: Build ISO with mkarchiso
      run: |
        cd ${{ env.WORKDIR }}/iso-build
        mkarchiso -v -w /root/work -o /root/out archiso

    - name: Show output
      run: |
        ls -lh /root/out/
        file /root/out/*.iso

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: CleanLinux-RTX2060
        path: /root/out/*.iso
        retention-days: 30
        if-no-files-found: error

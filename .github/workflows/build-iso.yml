name: Build CleanLinux ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build ISO in Docker container
      run: |
        set -e
        
        echo "==> 创建输出目录..."
        mkdir -p iso-out
        
        echo "==> 拉取 Arch Linux 镜像..."
        docker pull archlinux:latest
        
        echo "==> 运行 mkarchiso（需要 --privileged 以挂载 proc/sys）..."
        docker run --privileged --rm \
          -v "$(pwd)/iso-build/archiso:/src:ro" \
          -v "$(pwd)/iso-out:/out" \
          archlinux:latest \
          bash -e -c '
            set -e
            echo "==> 安装 archiso 及构建依赖..."
            pacman -Sy --noconfirm --needed base-devel xorriso mtools squashfs-tools archiso
            
            echo "==> 运行 mkarchiso..."
            mkarchiso -v -w /work -o /out /src
          '
        
        echo "==> 检查输出..."
        ls -lh iso-out/
        file iso-out/*.iso 2>/dev/null || echo "WARNING: No ISO found!"
      
    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: CleanLinux-RTX2060
        path: iso-out/*.iso
        retention-days: 30
        if-no-files-found: warn

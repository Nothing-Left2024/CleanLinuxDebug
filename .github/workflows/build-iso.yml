name: Build CleanLinux ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y genisoimage xorriso python3
        
    - name: Create ISO content
      run: |
        mkdir -p iso-content/{ROOTFS,SCRIPTS,DOCS}
        
        # Copy rootfs overlay
        if [ -d "iso-build/rootfs-overlay" ]; then
          cp -r iso-build/rootfs-overlay/* iso-content/ROOTFS/
        fi
        
        # Copy scripts
        cp iso-build/build-*.py iso-content/SCRIPTS/ 2>/dev/null || true
        cp iso-build/build-iso.sh iso-content/SCRIPTS/ 2>/dev/null || true
        
        # Copy docs
        if [ -d "docs" ]; then
          cp -r docs/* iso-content/DOCS/ 2>/dev/null || true
        fi
        
        # Create info file
        cat > iso-content/INFO.txt << 'INFOEOF'
CleanLinux ISO - NVIDIA RTX 2060 + llama.cpp Edition
=====================================================
CUDA: 7.5 (Turing)
VRAM: 6GB GDDR6
Recommended: Q4_K_M quantization

Features:
- NVIDIA proprietary driver pre-installed
- llama.cpp with CUDA acceleration
- Dynamic wallpaper (mpv)
- Frosted glass effect (picom)
- CLI default boot (~100MB RAM)

Chinese Mirrors:
- TUNA (Tsinghua)
- USTC
- Aliyun
- HIT
- JLU
- SJTU
INFOEOF
        cp iso-content/INFO.txt iso-content/ROOTFS/
        
    - name: Create ISO
      run: |
        genisoimage -o CleanLinux_RTX2060_x86_64.iso \
          -V "CLEANLINUX" \
          -R -J \
          -l \
          -input-charset utf-8 \
          iso-content/
          
        ls -lh CleanLinux_RTX2060_x86_64.iso
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CleanLinux-RTX2060
        path: CleanLinux_RTX2060_x86_64.iso
        retention-days: 30

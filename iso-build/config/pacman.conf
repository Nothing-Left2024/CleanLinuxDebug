# Pacman Configuration for CleanLinux ISO
[options]
Architecture = auto
Color
VerbosePkgLists
ParallelDownloads = 5
HoldPkg = pacman glibc
SigLevel = Required DatabaseOptional
SigLevel = PackageTrustOnly
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[community]
Include = /etc/pacman.d/mirrorlist

# Custom repositories (added by installer)
[nvidia-custom]
Server = https://mirrors.tuna.tsinghua.edu.cn/archlinux/$repo/os/$arch

[aur]
Server = https://mirrors.tuna.tsinghua.edu.cn/archlinux/aur/$arch

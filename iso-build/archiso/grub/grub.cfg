# CleanLinux — GRUB 菜单（UEFI 引导模式使用）
# 占位符 %ARCHISO_LABEL% %INSTALL_DIR% %ARCH% %KERNEL_PARAMS% %ARCHISO_UUID% 由 mkarchiso 替换
if loadfont "unicode.pf2"; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output console
fi

default=cleanlinux-gui
timeout=15
timeout_style=menu

menuentry "CleanLinux Live (graphical desktop, GUI installer)" {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cleanlinux_session=gui %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "CleanLinux Live (terminal + text menu)" {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cleanlinux_session=text %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "CleanLinux Install (direct GUI installer)" {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cleanlinux_session=installer %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == "efi" ]; then
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

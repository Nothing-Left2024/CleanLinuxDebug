# CleanLinux — GRUB 循环挂载（Live USB 从 ISO 文件引导）
# 占位符 %ARCHISO_SEARCH_FILENAME% 由 mkarchiso 替换
search --no-floppy --set=archiso_img_dev --file "%ARCHISO_SEARCH_FILENAME%"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

default=cleanlinux-gui
timeout=15
timeout_style=menu

menuentry "CleanLinux Live (graphical desktop, GUI installer)" {
    set gfxpayload=keep
    loopback loop (archiso_img_dev)/%ARCHISO_SEARCH_FILENAME%
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux root=UUID=0000-0000 rootflags=loop,loop,ro archisobasedir=%INSTALL_DIR% archisosearchuuid=${archiso_img_dev_uuid} img_loop="(%archiso_img_dev)/%ARCHISO_SEARCH_FILENAME%" cleanlinux_session=gui %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "CleanLinux Live (terminal + text menu)" {
    set gfxpayload=keep
    loopback loop (archiso_img_dev)/%ARCHISO_SEARCH_FILENAME%
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux root=UUID=0000-0000 rootflags=loop,loop,ro archisobasedir=%INSTALL_DIR% archisosearchuuid=${archiso_img_dev_uuid} img_loop="(%archiso_img_dev)/%ARCHISO_SEARCH_FILENAME%" cleanlinux_session=text %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "CleanLinux Install (direct GUI installer)" {
    set gfxpayload=keep
    loopback loop (archiso_img_dev)/%ARCHISO_SEARCH_FILENAME%
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux root=UUID=0000-0000 rootflags=loop,loop,ro archisobasedir=%INSTALL_DIR% archisosearchuuid=${archiso_img_dev_uuid} img_loop="(%archiso_img_dev)/%ARCHISO_SEARCH_FILENAME%" cleanlinux_session=installer %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ -f "/memtest86+/memtest86${grub_cpu}" ]; then
    menuentry "Run Memtest86+ (RAM test)" {
        set gfxpayload=800x600,1024x768
        linux /memtest86+/memtest86${grub_cpu}
    }
fi

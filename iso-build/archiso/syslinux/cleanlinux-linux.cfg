# 占位符 %ARCH% %INSTALL_DIR% %ARCHISO_UUID% %KERNEL_PARAMS% 由 mkarchiso 替换

LABEL cleanlinux-gui
TEXT HELP
CleanLinux graphical desktop (default).
openbox + tint2 + picom frosted glass + dynamic wallpaper.
GUI installer reachable from the desktop menu.
ENDTEXT
MENU LABEL CleanLinux Live (graphical desktop, GUI installer)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cleanlinux_session=gui %KERNEL_PARAMS%

LABEL cleanlinux
TEXT HELP
CleanLinux terminal mode (~120 MB RAM).
After login a text menu offers:
  1. graphically try the system   2. graphical installer
  3. install NVIDIA driver        4. build llama.cpp (CUDA)
  5. text-mode install (archinstall)
ENDTEXT
MENU LABEL CleanLinux Live (terminal + text menu)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cleanlinux_session=text %KERNEL_PARAMS%

LABEL cleanlinux-installer
TEXT HELP
Directly boot into the graphical installer
(calamares on top of the CleanLinux desktop).
ENDTEXT
MENU LABEL CleanLinux Install (direct GUI installer)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cleanlinux_session=installer %KERNEL_PARAMS%

LABEL arch
TEXT HELP
Plain Arch Linux install medium (upstream behavior).
ENDTEXT
MENU LABEL Arch Linux install medium
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

title    CleanLinux Live (graphical desktop, GUI installer)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasearch=n archisoarch=%ARCH% archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cleanlinux_session=gui %KERNEL_PARAMS%

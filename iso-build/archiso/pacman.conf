[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://mirror.freedif.org/archlinux/$repo/os/$arch
Server = https://mirror.neverssl.com/archlinux/$repo/os/$arch
Server = https://geo.mirror.pkg.dev/archlinux/$repo/os/$arch
Server = https://archlinux.mirror.rackspace.com/$repo/os/$arch

[extra]
Server = https://mirror.freedif.org/archlinux/$repo/os/$arch
Server = https://mirror.neverssl.com/archlinux/$repo/os/$arch
Server = https://geo.mirror.pkg.dev/archlinux/$repo/os/$arch
Server = https://archlinux.mirror.rackspace.com/$repo/os/$arch

[multilib]
Server = https://mirror.freedif.org/archlinux/$repo/os/$arch
Server = https://mirror.neverssl.com/archlinux/$repo/os/$arch
Server = https://geo.mirror.pkg.dev/archlinux/$repo/os/$arch
Server = https://archlinux.mirror.rackspace.com/$repo/os/$arch

[community]
Server = https://mirror.freedif.org/archlinux/$repo/os/$arch
Server = https://mirror.neverssl.com/archlinux/$repo/os/$arch
Server = https://geo.mirror.pkg.dev/archlinux/$repo/os/$arch

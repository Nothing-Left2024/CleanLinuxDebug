# CleanLinux — macOS 风格液态玻璃效果
# 语法: picom 0.4 (Arch 官方仓库)
backend = "glx"
vsync = true
glx-no-stencil = true
glx-no-rebind-pixmap = true

# 阴影
shadow = true
shadow-radius = 12
shadow-opacity = 0.35
shadow-offset-x = -8
shadow-offset-y = -8

# 模糊 (磨砂玻璃)
blur {
  method = "dual_kawase"
  strength = 12
  background-only = true
  background-exclude = [
    "window_type = 'desktop'",
    "class_g ?= 'Mpv'",
    "class_g ?= 'Xwinwrap'",
    "class_g ?= 'Feh'"
  ]
  kern = "5x5 gaussian"
}

# 淡入淡出
fade = true
fade-in-step = 0.05
fade-out-step = 0.05

# 透明度 (模拟 macOS 半透明窗口)
inactive-opacity = 0.92
frame-opacity = 0.95
inactive-opacity-override = false

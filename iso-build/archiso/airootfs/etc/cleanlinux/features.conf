# CleanLinux 功能配置（cleanlinux-features 读写，.xinitrc 读取）
WALLPAPER=on          # 动态壁纸 (mpv ~40MB / xwallpaper 静态)
BLUR_STRENGTH=12      # 毛玻璃强度 0-20，0=关闭 picom
TASKBAR=on            # 任务栏 (tint2 ~10MB)
CONKY=on              # 液态玻璃 HUD 仪表盘 (conky ~2MB)
ZRAM=on               # 内存压缩交换 (内存的一半)
NVIDIA_PERSISTENCE=off # NVIDIA 驱动持久模式

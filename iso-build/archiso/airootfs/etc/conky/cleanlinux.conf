-- CleanLinux 液态玻璃仪表盘 (conky)
-- 桌面右上半透明 HUD: CPU / 内存 / GPU 显存 / TOP 进程
-- 由 cleanlinux-monitor 启停; ~2MB 内存
-- own_window_type=desktop 使其避开 picom 毛玻璃(与壁纸自然融合)

conky.config = {
    alignment = 'top_right',
    gap_x = 24,
    gap_y = 48,

    own_window = true,
    own_window_type = 'desktop',
    own_window_argb_visual = true,
    own_window_argb_value = 110,     -- 半透明深色底, 视频壁纸上仍可读
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    double_buffer = true,
    update_interval = 3,
    no_buffers = true,

    use_xft = true,
    font = 'Noto Sans CJK SC:size=10',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,

    default_color = 'e6e6e6',
    color1 = '8ab4f8',               -- 标题蓝
    color2 = '81c995',               -- 数值绿

    default_bar_size = 200 7,
    minimum_width = 360,

    out_to_console = false,
    out_to_x = true,
}

conky.text = [[
${color1}CleanLinux${color}  已运行 ${uptime_short}

${color1}━━━ 系统 ━━━${color}
CPU ${execbar 3 cleanlinux-gpu-cpu} ${cpu cpu0}%   频率 ${freq_g} GHz
RAM ${membar}  ${mem} / ${memmax} (${memperc}%)
SWAP ${swapbar}  ${swap} / ${swapmax}
磁盘 ${fs_bar 7 /}  ${fs_used /} / ${fs_size /}

${color1}━━━ NVIDIA 显存 ━━━${color}${if_existing /proc/driver/nvidia/version}
${execi 5 cleanlinux-gpu model}
显存 ${execbar 5 cleanlinux-gpu pct} ${color2}${execi 5 cleanlinux-gpu line}${color}
GPU  ${execbar 5 cleanlinux-gpu util} ${execi 5 cleanlinux-gpu util}%
温度 ${execi 5 cleanlinux-gpu temp}°C   功耗 ${execi 5 cleanlinux-gpu power}
显存进程:
${execpi 5 cleanlinux-gpu top}${else}
未检测到 NVIDIA 驱动
运行 install-nvidia 安装后启用${endif}

${color1}━━━ 进程 TOP5 (内存) ━━━${color}
${color2}1. ${top name 1}${color}  ${top mem_res 1}  CPU ${top cpu 1}%
${color2}2. ${top name 2}${color}  ${top mem_res 2}  CPU ${top cpu 2}%
${color2}3. ${top name 3}${color}  ${top mem_res 3}  CPU ${top cpu 3}%
${color2}4. ${top name 4}${color}  ${top mem_res 4}  CPU ${top cpu 4}%
${color2}5. ${top name 5}${color}  ${top mem_res 5}  CPU ${top cpu 5}%
]]
